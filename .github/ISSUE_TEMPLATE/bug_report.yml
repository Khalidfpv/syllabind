name: Bug report
description: Something in the build, export or checks does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got. Paste the full command output.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Course Builder version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
  - type: checkboxes
    id: example
    attributes:
      label: Reproduction
      options:
        - label: The bundled sample course builds and passes both checks on my machine
